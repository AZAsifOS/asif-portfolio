<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090e1b"><title>404 | Page Not Found</title><link rel="stylesheet" href="style.css"><style>.error-wrap{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px}.error-card{max-width:650px;padding:55px 35px;border:1px solid var(--border);border-radius:30px;background:var(--panel);box-shadow:var(--shadow)}.error-code{font:800 clamp(5rem,18vw,10rem)/1 Manrope,sans-serif;letter-spacing:-.08em;background:linear-gradient(110deg,var(--accent),var(--accent-2),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}.error-card h1{font:700 1.6rem Manrope,sans-serif}.error-card p{color:var(--muted);margin-bottom:25px}</style></head><body><main class="error-wrap"><div class="error-card"><p class="eyebrow">SYSTEM MESSAGE / 404</p><p class="error-code">404</p><h1>Page not found.</h1><p>The page you're looking for may have moved or doesn't exist.</p><a class="button primary" href="index.html"><i class="fa-solid fa-house"></i> Back to Homepage</a></div></main></body></html>
